<?xml version="1.0" encoding="UTF-8"?>
<!--
  WhatsApp Doppel app icon — hand-editable source.
  The shipped PNG/ICNS is rendered by scripts/geniconn (stdlib Go) from the same
  geometry; keep the two in sync if you change shapes or colors.
  Grid: 1024×1024 canvas, 824×824 icon body (Apple macOS icon grid).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BE37F"/>
      <stop offset="0.5" stop-color="#10B3A3"/>
      <stop offset="1" stop-color="#7B5CF5"/>
    </linearGradient>
    <radialGradient id="light" cx="260" cy="200" r="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx="470" cy="150" rx="520" ry="330" r="520" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(470 150) scale(1 0.635) translate(-470 -150)">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frontFill" x1="0" y1="440" x2="0" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F7F3"/>
    </linearGradient>
    <linearGradient id="dots" x1="504" y1="0" x2="696" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC98A"/>
      <stop offset="1" stop-color="#6B57E0"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="innerGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- Continuous-corner squircle, 824 px wide, centred. -->
    <path id="squircle" d="M330 100 H694 C870 100 924 154 924 330 V694 C924 870 870 924 694 924 H330 C154 924 100 870 100 694 V330 C100 154 154 100 330 100 Z"/>
    <clipPath id="clipBody"><use href="#squircle"/></clipPath>
    <!-- Back bubble (translucent twin): body + bottom-left tail. -->
    <path id="backBubble" d="M313 250 H527 Q645 250 645 368 V452 Q645 570 527 570 H322
             Q226 581 160 628 Q195 566 195 430 V368 Q195 250 313 250 Z"/>
    <!-- Front bubble (solid): body + bottom-right tail. -->
    <path id="frontBubble" d="M489 432 H711 Q835 432 835 556 V630 Q835 774 872 828
             Q794 779 696 768 H489 Q365 768 365 644 V556 Q365 432 489 432 Z"/>
  </defs>

  <!-- drop shadow -->
  <use href="#squircle" fill="#0B3B3F" opacity="0.35" transform="translate(0 14)" filter="url(#iconShadow)"/>

  <!-- body -->
  <use href="#squircle" fill="url(#body)"/>
  <g clip-path="url(#clipBody)">
    <use href="#squircle" fill="url(#light)"/>
    <!-- liquid-glass rim glow -->
    <use href="#squircle" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="28" filter="url(#innerGlow)"/>
    <ellipse cx="470" cy="150" rx="520" ry="330" fill="url(#sheen)"/>
    <!-- back bubble -->
    <use href="#backBubble" fill="#0B3B3F" opacity="0.12" transform="translate(6 16)" filter="url(#bubbleShadow)"/>
    <use href="#backBubble" fill="#fff" fill-opacity="0.34" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
    <g fill="#fff" fill-opacity="0.55">
      <circle cx="332" cy="404" r="24"/>
      <circle cx="420" cy="404" r="24"/>
      <circle cx="508" cy="404" r="24"/>
    </g>
    <!-- front bubble -->
    <use href="#frontBubble" fill="#0B3B3F" opacity="0.30" transform="translate(4 22)" filter="url(#bubbleShadow)"/>
    <use href="#frontBubble" fill="url(#frontFill)"/>
    <g fill="url(#dots)">
      <circle cx="504" cy="596" r="30"/>
      <circle cx="600" cy="596" r="30"/>
      <circle cx="696" cy="596" r="30"/>
    </g>
    <g fill="#fff" fill-opacity="0.45">
      <circle cx="495" cy="586" r="8"/>
      <circle cx="591" cy="586" r="8"/>
      <circle cx="687" cy="586" r="8"/>
    </g>
  </g>
  <!-- thin bright edge -->
  <use href="#squircle" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
</svg>
