# The translator add-on's Python side. The app installs these dependencies into
# <data>/translator/venv: translate.go reads them from this file, so the pins
# live only here. Models are not listed: each user downloads their own.
[project]
name = "whatsapp-doppel-translator"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "ctranslate2==4.8.5",
    "sentencepiece==0.2.3",
    "spacy==3.8.18",
    "pydantic==2.14.3",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["UP031"] # the file builds its tokens with % throughout
